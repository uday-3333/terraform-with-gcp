steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=gcr.io/$PROJECT_ID/maintenance-callout:latest
      - --file=Dockerfile
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, "gcr.io/$PROJECT_ID/maintenance-callout:latest"]
    waitFor: [build]

  - id: print-digest
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    args:
      - -c
      - |
        echo "================================================"
        echo "Image URI to use in locals.tf:"
        docker inspect --format='{{index .RepoDigests 0}}' \
          gcr.io/$PROJECT_ID/maintenance-callout:latest
        echo "================================================"
    waitFor: [push]

images:
  - gcr.io/$PROJECT_ID/maintenance-callout:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
